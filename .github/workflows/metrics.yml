name: Refresh Profile Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/**"
      - "profile/README.md"
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  ORG_NAME: SynlysAI

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync with latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Generate custom analytics dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_VISIBILITY: all
          HIDE_PRIVATE_REPO_NAMES: "true"
          INCLUDE_FORKS: "true"
        run: |
          python scripts/generate_org_dashboard.py --org "$ORG_NAME" --output github-analytics.svg

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-analytics.svg
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh organization profile analytics"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt $attempt, rebasing onto latest origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push refreshed assets after 3 attempts"
          exit 1
