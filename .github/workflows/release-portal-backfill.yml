name: Release Portal Backfill

on:
  workflow_dispatch:
    inputs:
      product:
        description: 要回填的产品；all 表示全部六个产品
        required: true
        default: all
        type: choice
        options:
          - all
          - ai4ms
          - spec-agent
          - poly-agent
          - speclabos
          - ragportal
          - smartaccess

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-portal-candidates
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装运行依赖
        run: python -m pip install -r requirements.txt

      - name: 获取 GitHub App 安装令牌
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNLYSAI_APP_ID }}
          private-key: ${{ secrets.SYNLYSAI_APP_PRIVATE_KEY }}
          owner: SynlysAI

      - name: 回填最多 500 条历史提交
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_PRIVATE_ENDPOINT_ALLOWLIST: ${{ vars.AI_BASE_URL }}
        run: >-
          python -m scripts.release_portal.cli backfill
          --product "${{ inputs.product }}"
          --limit 500

      - name: 保存本次候选 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-portal-candidates
          path: |
            release-portal/candidates/
            release-portal/state/backfill.json
          if-no-files-found: error

      - name: 创建或更新候选审核 PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- release-portal/candidates release-portal/state/backfill.json; then
            echo "本批没有可审核提交"
            exit 0
          fi
          git config user.name "synlysai-release-portal[bot]"
          git config user.email "41898282+synlysai-release-portal[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin automation/release-portal-candidates >/dev/null 2>&1; then
            git fetch origin automation/release-portal-candidates:refs/remotes/origin/automation/release-portal-candidates
          fi
          git checkout -B automation/release-portal-candidates
          git add release-portal/candidates release-portal/state/backfill.json
          git commit -m "chore: 回填 Release Portal 候选数据"
          git push --force-with-lease=refs/heads/automation/release-portal-candidates origin HEAD:automation/release-portal-candidates
          pr_number="$(gh pr list --head automation/release-portal-candidates --base main --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: 审核 Release Portal 候选数据" --body "自动回填历史提交，单次每仓库最多 500 条。"
          else
            gh pr create --base main --head automation/release-portal-candidates --title "chore: 审核 Release Portal 候选数据" --body "自动回填历史提交，单次每仓库最多 500 条。"
          fi
